[tool.poetry]
name = "codecraftai-arcli"
description = "Advanced Re-Usable Commandline Interface Framework"
version = "0.0.1"
authors = ["CodeCraftX <automationx@code-craft.ai>"]
readme = "README.rst"
license = "LICENSE.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX"
]
keywords = [
    "python"
]
packages = [{include="ccai", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
codecraftai-errors = { git = "https://github.com/automationmojo/codecraftai-errors.git", rev = "main" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

