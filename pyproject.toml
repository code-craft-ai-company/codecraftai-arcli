[tool.poetry]
name = "codecraftai-arcli"
description = "Advanced Re-Usable Commandline Interface Framework"
version = "1.0.0"
authors = ["CodeCraftX <automationx@code-craft.ai>"]
readme = "README.rst"
license = "LicenseRef-CodeCraftAI-Dual-License"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX"
]
keywords = [
    "python"
]
packages = [{include="ccai", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pyyaml = "^6.0.2"
codecraftai-errors = { version = "<2.0.0", source = "codecraftai" }

[tool.poetry.group.dev.dependencies]
hypothesis = "^6.0.0"


[[tool.poetry.source]]
name = "codecraftai"
url = "https://code-craft.ai/licensed-repository/simple/"
priority = "supplemental"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

